services:
  - type: web
    name: nvs-buildcon-backend
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: IS_PRODUCTION
        value: true
      - key: PORT
        value: 10000
